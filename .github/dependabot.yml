version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # 以下升级需专项回归后再手动跟进（major 行为变化 / 重写 / 与 pandas 2.x 的组合）
    ignore:
      - dependency-name: pandas
        versions: [">=3"]
      - dependency-name: kaleido
        versions: [">=1"]
      - dependency-name: numpy
        versions: [">=2"]
      - dependency-name: plotly
        versions: [">=6"]
      - dependency-name: altair
        versions: [">=6"]
      - dependency-name: psutil
        versions: [">=6"]
      - dependency-name: streamlit
        versions: [">=1.37"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
