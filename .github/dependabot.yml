version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # 大版本升级需专项回归（pandas 3 行为变化 / kaleido 1 重写 / numpy 2.5+），先忽略
    ignore:
      - dependency-name: pandas
        versions: [">=3"]
      - dependency-name: kaleido
        versions: [">=1"]
      - dependency-name: numpy
        versions: [">=2.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
